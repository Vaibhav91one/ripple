name: Agent evals (nightly, live)
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:6.0.2
        ports: ["6379:6379"]
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      MODEL_AGENT: ${{ vars.MODEL_AGENT }}
    steps:
      - name: Skip without LLM_API_KEY
        if: env.LLM_API_KEY == ''
        run: echo "Agent evals skipped, the LLM_API_KEY secret is not set." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.LLM_API_KEY != ''
      - uses: pnpm/action-setup@v4 # version from packageManager
        if: env.LLM_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.LLM_API_KEY != ''
        with:
          node-version: 22
          cache: pnpm
      - if: env.LLM_API_KEY != ''
        run: pnpm install --frozen-lockfile
      - name: Live agent evals (summary goes to the job output)
        if: env.LLM_API_KEY != ''
        run: pnpm eval:agents --live
