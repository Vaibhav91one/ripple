# Self-host Ripple: `cp .env.example .env && docker compose up -d --build`, then open http://localhost:3000.
# Every variable has a default, so the stack starts with zero edits. See SELF_HOSTING.md.
# Optional HTTPS in front: `docker compose --profile tls up -d` (set RIPPLE_DOMAIN in .env).
x-ripple-env: &ripple-env
  FALKORDB_HOST: falkordb
  FALKORDB_PORT: "6379"
  FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-ripple-local}
  DATABASE_URL: postgres://ripple:${POSTGRES_PASSWORD:-ripple-local}@db:5432/ripple
  RIPPLE_MODE: ${RIPPLE_MODE:-local}
  APP_URL: ${APP_URL:-http://localhost:3000}
  ACK_TOKEN_SECRET: ${ACK_TOKEN_SECRET:-ripple-local-ack-secret-change-me}
  RESET_TOKEN: ${RESET_TOKEN:-ripple-local-reset-token}
  RIPPLE_SECRET_KEY: ${RIPPLE_SECRET_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  MODEL_AGENT: ${MODEL_AGENT:-}
  MODEL_EXTRACT: ${MODEL_EXTRACT:-}
  DAILY_TOKEN_BUDGET: ${DAILY_TOKEN_BUDGET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_REPO: ${GITHUB_REPO:-}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}

services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:-ripple-local} --appendonly yes --appendfsync everysec"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${FALKORDB_PASSWORD:-ripple-local}' ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ripple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ripple-local}
      POSTGRES_DB: ripple
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripple -d ripple"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: deploy/fallback/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      falkordb: { condition: service_healthy }
      db: { condition: service_healthy }
    environment: *ripple-env
    ports: ["${WEB_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: deploy/fallback/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      falkordb: { condition: service_healthy }
      web: { condition: service_healthy } # web runs the migrations; the worker waits for them
    environment: *ripple-env

  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RIPPLE_DOMAIN: ${RIPPLE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

volumes:
  falkordb-data:
  postgres-data:
  caddy-data:
