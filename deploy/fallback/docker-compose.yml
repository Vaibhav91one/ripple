# Fallback host: any VPS with Docker. Usage: see docs/deploy.md ("Fallback").
# Needs a .env next to this file: FALKORDB_PASSWORD, RESET_TOKEN, LLM_API_KEY (+ LLM_PROVIDER, MODEL_*).
services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD}"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    mem_limit: 1g

  web:
    build:
      context: ../..
      dockerfile: deploy/fallback/Dockerfile
    restart: unless-stopped
    depends_on: [falkordb]
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

volumes:
  falkordb-data:
  caddy-data:
