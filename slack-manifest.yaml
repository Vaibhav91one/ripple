# Create the Slack app from this file: api.slack.com/apps -> Create New App -> From a manifest.
# Hosted at https://ripple.vaibhav.quest (change it if APP_URL differs; Slack needs https). Then copy Client ID/Secret and the
# Signing Secret into SLACK_CLIENT_ID / SLACK_CLIENT_SECRET / SLACK_SIGNING_SECRET.
display_information:
  name: Ripple
  description: Tells the right people when a change lands, and records who was told.
  background_color: "#0b0d10"
features:
  bot_user:
    display_name: Ripple
    always_online: true
  shortcuts:
    - name: Save to Ripple
      type: message
      callback_id: save_to_ripple
      description: Save this message as evidence in Ripple
  slash_commands:
    - command: /ripple
      url: https://ripple.vaibhav.quest/api/slack/command
      description: Ask Ripple who a change affects
      usage_hint: "[question] or decision [text]"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://ripple.vaibhav.quest/api/slack/oauth
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - channels:manage
      - channels:join
      - channels:read
      - channels:history
      - groups:write
      - groups:history
      - im:write
      - users:read
      - users:read.email
      - pins:write
      - commands
settings:
  event_subscriptions:
    request_url: https://ripple.vaibhav.quest/api/slack/events
    bot_events:
      - message.channels
      - message.groups
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://ripple.vaibhav.quest/api/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
