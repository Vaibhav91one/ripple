# Zerops pipeline for Ripple. Key names checked against docs.zerops.io/zerops-yaml/specification,
# /docker/overview and /nodejs/how-to/build-pipeline. Not run on a real account yet; "UNCONFIRMED" marks guesses.
# Project secrets (set in the project, shared by both services): FALKORDB_PASSWORD, RESET_TOKEN, LLM_API_KEY.
# RAM/CPU/disk are NOT set here: they live in the import yaml (verticalAutoscaling), see docs/deploy.md.
zerops:
  # `setup` must equal the service hostname (or be selected via zeropsSetup in the import yaml).
  - setup: falkordb
    run:
      base: docker@latest
      prepareCommands:
        # Pinned tag, per the docker page (prepareCommands output is cached, so never use :latest).
        - docker image pull falkordb/falkordb:6.0.2
      # --network=host is required by the docker page; ports are declared below, not with -p.
      # REDIS_ARGS is read by the falkordb image entrypoint (UNCONFIRMED against the Zerops docs; it is a FalkorDB image feature).
      # UNCONFIRMED: persistence. Mount a volume at /var/lib/falkordb/data if Zerops offers one; without it, the web service reseeds on boot.
      start: >-
        docker run --rm --network=host
        -e REDIS_ARGS="--requirepass $FALKORDB_PASSWORD"
        falkordb/falkordb:6.0.2
      ports:
        - port: 6379
          protocol: tcp
          httpSupport: false # internal only: do not add a public route for this port

  - setup: web
    build:
      base: nodejs@22
      os: ubuntu # onnxruntime-node (transformers.js embeddings) needs glibc; the default Alpine has none
      buildCommands:
        - pnpm install --frozen-lockfile
        - pnpm build
        # standalone needs static + public copied next to server.js (Next docs: self-hosting guide)
        - cp -r .next/static .next/standalone/.next/static
        - cp -r public .next/standalone/public
      deployFiles:
        # whole folder lands in /var/www/.next/standalone (paths are kept; "~" shortening not relied on)
        - .next/standalone
      cache: node_modules
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        FALKORDB_HOST: falkordb # services reach each other by hostname (docs: "app:3000")
        FALKORDB_PORT: "6379"
        # FALKORDB_PASSWORD, RESET_TOKEN, LLM_API_KEY come from project-level secrets (UNCONFIRMED: that
        # project env vars are visible by bare name in every service; otherwise add them here).
        LLM_PROVIDER: openai
        MODEL_AGENT: gpt-5.4-mini
        MODEL_EXTRACT: gpt-5.4-nano
      # server.js does process.chdir(__dirname), so the .cypher files resolve from the standalone folder.
      start: HOSTNAME=0.0.0.0 node .next/standalone/server.js # HOSTNAME is a reserved Zerops env key, so set it inline
      healthCheck:
        httpGet:
          port: 3000
          path: /
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: / # not /api/health: a FalkorDB blip must not fail the deploy or restart the web container
