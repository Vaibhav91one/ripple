# Zerops pipeline for Ripple. Key names checked against docs.zerops.io/zerops-yaml/specification,
# /docker/overview and /nodejs/how-to/build-pipeline. Not run on a real account yet; "UNCONFIRMED" marks guesses.
# Project secrets (set in the project, shared by both services): FALKORDB_PASSWORD, RESET_TOKEN, LLM_API_KEY.
# RAM/CPU/disk are NOT set here: they live in the import yaml (verticalAutoscaling), see docs/deploy.md.
zerops:
  # `setup` must equal the service hostname (or be selected via zeropsSetup in the import yaml).
  - setup: falkordb
    run:
      base: docker@latest
      prepareCommands:
        # Pinned tag, per the docker page (prepareCommands output is cached, so never use :latest).
        - docker image pull falkordb/falkordb:6.0.2
      # --network=host is required by the docker page; ports are declared below, not with -p.
      # REDIS_ARGS is read by the falkordb image entrypoint (UNCONFIRMED against the Zerops docs; it is a FalkorDB image feature).
      # Persistence (#91): a docker-managed named volume `falkordb-data` at /data, AOF on. The start command
      # runs as a non-root user, so a host dir under /var/lib can't be created (mkdir: Permission denied on
      # 2026-10-17); a named volume needs no mkdir. Whether it survives a redeploy is verified with a marker node.
      # Fallback if the VM disk does not survive a redeploy:
      # FalkorDB Cloud (docs/deploy.md). --name lets scripts/backup-falkordb.sh use `docker exec falkordb redis-cli`.
      start: >-
        docker run --rm --name falkordb --network=host
        -v falkordb-data:/data
        -e REDIS_ARGS="--requirepass $FALKORDB_PASSWORD --appendonly yes --appendfsync everysec"
        falkordb/falkordb:6.0.2
      # Nightly backup (#91). UNCONFIRMED (needs an object-storage service `storage` and the script on the VM,
      # i.e. deploy this service with scripts/backup-falkordb.sh; enable after the orchestrator checks both):
      # envVariables:
      #   BACKUP_S3_ENDPOINT: ${storage_apiUrl}
      #   BACKUP_S3_BUCKET: ${storage_bucketName}
      #   BACKUP_S3_ACCESS_KEY: ${storage_accessKeyId}
      #   BACKUP_S3_SECRET_KEY: ${storage_secretAccessKey}
      #   BACKUP_REDIS_CLI: docker exec falkordb redis-cli
      # crontab:
      #   - command: "sh scripts/backup-falkordb.sh"
      #     timing: "0 3 * * *"
      #     allContainers: false
      #     workingDir: /var/www
      ports:
        - port: 6379
          protocol: tcp
          httpSupport: false # internal only: do not add a public route for this port

  - setup: web
    build:
      base: nodejs@22
      os: ubuntu # onnxruntime-node (transformers.js embeddings) needs glibc; the default Alpine has none
      buildCommands:
        - pnpm install --frozen-lockfile
        - pnpm build
        # standalone needs static + public copied next to server.js (Next docs: self-hosting guide)
        - cp -r .next/static .next/standalone/.next/static
        - cp -r public .next/standalone/public
        # migrations run from the standalone folder (node scripts/migrate.mjs), so it needs the script + sql
        - mkdir -p .next/standalone/scripts .next/standalone/lib/db
        - cp scripts/migrate.mjs .next/standalone/scripts/
        - cp -r lib/db/migrations .next/standalone/lib/db/
      deployFiles:
        # whole folder lands in /var/www/.next/standalone (paths are kept; "~" shortening not relied on)
        - .next/standalone
      cache: node_modules
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        FALKORDB_HOST: falkordb # services reach each other by hostname (docs: "app:3000")
        FALKORDB_PORT: "6379"
        # Enable once the `db` service exists (orchestrator does it when creating the service):
        # DATABASE_URL: ${db_connectionString} # direct 5432 string from the `db` service
        # FALKORDB_PASSWORD, RESET_TOKEN, LLM_API_KEY come from project-level secrets (UNCONFIRMED: that
        # project env vars are visible by bare name in every service; otherwise add them here).
        LLM_PROVIDER: openai
        MODEL_AGENT: gpt-5.4
        MODEL_EXTRACT: gpt-5.4-nano
      # Postgres (service `db`, see docs/deploy.md). initCommands run on every container start; execOnce
      # makes the migration run once per deploy version. The script skips itself when DATABASE_URL is unset.
      # initCommands:
      #   - zsc execOnce ${ZEROPS_appVersionId} -- node scripts/migrate.mjs
      # server.js does process.chdir(__dirname), so the .cypher files resolve from the standalone folder.
      start: HOSTNAME=0.0.0.0 node .next/standalone/server.js # HOSTNAME is a reserved Zerops env key, so set it inline
      healthCheck:
        httpGet:
          port: 3000
          path: /
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: / # not /api/health: a FalkorDB blip must not fail the deploy or restart the web container
